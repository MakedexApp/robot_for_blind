controller_frequency: 10.0
base_local_planner: "dwa_local_planner/DWAPlannerROS"

DWAPlannerROS:
  publish_cmd_vel_topic: /cmd_vel_raw
  max_vel_x: 0.42
  min_vel_x: 0.05
  max_trans_vel: 0.42
  min_trans_vel: 0.05

  max_rot_vel: 1.0
  min_rot_vel: 0.3

  acc_lim_x: 0.5
  acc_lim_theta: 1.5

  sim_time: 2.0
  vx_samples: 20
  vtheta_samples: 40

  path_distance_bias: 24.0
  goal_distance_bias: 18.0
  occdist_scale: 0.5

  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  oscillation_reset_dist: 0.05

  xy_goal_tolerance: 0.2
  yaw_goal_tolearnce: 0.1
  latch_xy_goal_tolerance: ture
