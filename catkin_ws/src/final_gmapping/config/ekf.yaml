  sensor_timeout: 0.1
  transform_tolerance: 0.5

  two_d_mode: true
  publish_tf: true
  map_frame: map
  odom_frame: odom
  base_link_frame: base_footprint
  world_frame: odom

  odom0: /odom
  odom0_config: [true,  true,  false,
                 false, false, true,
                 false, false, false,
                 false, false, false,
                 false, false, false]

  imu0: /imu/data_raw
  imu0_config: [false, false, false,
                true,  true,  true,
                false, false, false,
                true,  true,  true,
                false, false, false]
  imu0_differential: true
  imu0_remove_gravitational_acceleration: true

